<script>
function lookup(scope, pathStr) {
  pathStr = pathStr.trim();
  if (pathStr === 'true') return true; if (pathStr === 'false') return false;
  return pathStr.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
}
function esc(v) { return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function matchBlock(tpl, tag, from) {
  // retourne [openStart, openEnd, closeStart, closeEnd] du premier <tag ...>...</tag> à partir de `from`, en gérant l'imbrication
  const openRe = new RegExp('<' + tag + '\\b[^>]*>', 'g'); openRe.lastIndex = from;
  const m = openRe.exec(tpl); if (!m) return null;
  let depth = 1, i = m.index + m[0].length;
  const anyRe = new RegExp('<' + tag + '\\b[^>]*>|</' + tag + '>', 'g'); anyRe.lastIndex = i;
  let t;
  while ((t = anyRe.exec(tpl))) { depth += t[0][1] === '/' ? -1 : 1; if (depth === 0) return [m.index, m.index + m[0].length, t.index, t.index + t[0].length, m[0]]; }
  return null;
}
function render(tpl, scope, fnMap) {
  for (const tag of ['sc-for', 'sc-if']) {
    let pos = 0, out = '';
    while (true) {
      const b = matchBlock(tpl, tag, pos); if (!b) { out += tpl.slice(pos); break; }
      out += tpl.slice(pos, b[0]);
      const open = b[4], body = tpl.slice(b[1], b[2]);
      if (tag === 'sc-for') {
        const listPath = open.match(/list="\{\{\s*([\w.$]+)\s*\}\}"/)[1], as = open.match(/as="(\w+)"/)[1];
        const list = lookup(scope, listPath) || [];
        out += list.map((item, i) => render(body, { ...scope, [as]: item, $index: i }, fnMap)).join('');
      } else {
        const cond = open.match(/value="\{\{\s*([\w.$]+)\s*\}\}"/)[1];
        out += lookup(scope, cond) ? render(body, scope, fnMap) : '';
      }
      pos = b[3];
    }
    tpl = out;
  }
  tpl = tpl.replace(/onClick="\{\{\s*([\w.$]+)\s*\}\}"/g, (m, p) => fnMap ? fnMap(p, scope) : '');
  tpl = tpl.replace(/\{\{\s*([\w.$]+)\s*\}\}/g, (m, p) => { const v = lookup(scope, p); return typeof v === 'function' ? '' : esc(v); });
  return tpl;
}
class DCLogic{constructor(p){this.props=p||{};this.state={};}setState(s){this.state=Object.assign({},this.state,s);rerender();}}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { n: { postes: 8, portables: 4, ecrans: 10, reseau: 3, imprimantes: 2 }, age: 'mid', support: 'none', mode: 'achat', sensible: 'non' };
  }
  renderVals() {
    const s = this.state;
    const fmt = (v) => v.toLocaleString('fr-CA', { style: 'currency', currency: 'CAD', maximumFractionDigits: 0 });
    const setN = (k, d) => () => this.setState({ n: { ...s.n, [k]: Math.max(0, s.n[k] + d) } });
    const cats = [
      { k: 'postes', nom: 'Postes de travail' }, { k: 'portables', nom: 'Portables' }, { k: 'ecrans', nom: 'Écrans' },
      { k: 'reseau', nom: 'Équipements réseau' }, { k: 'imprimantes', nom: 'Imprimantes' }
    ].map(c => ({ ...c, n: s.n[c.k], plus: setN(c.k, 1), moins: setN(c.k, -1) }));
    const total = Object.values(s.n).reduce((a, b) => a + b, 0);

    const opt = (list, key) => list.map(o => {
      const on = s[key] === o.v;
      return { ...o, pick: () => this.setState({ [key]: o.v }), bg: on ? '#14202B' : '#FFFFFF', fg: on ? '#FFFFFF' : '#14202B', bd: on ? '#14202B' : '#B8C4CE' };
    });
    const ages = opt([{ v: 'new', label: 'Moins de 2 ans' }, { v: 'mid', label: '2 à 4 ans' }, { v: 'old', label: 'Plus de 4 ans' }], 'age');
    const supports = opt([{ v: 'internal', label: 'Quelqu’un à l’interne' }, { v: 'none', label: 'Personne / on se débrouille' }, { v: 'other', label: 'Un autre fournisseur' }], 'support');
    const modes = opt([{ v: 'achat', label: 'Acheter — je garde mes appareils' }, { v: 'location', label: 'Louer — un montant fixe par mois, remplacement inclus' }], 'mode');
    const sens = opt([{ v: 'oui', label: 'Oui — données de patients, financières ou juridiques' }, { v: 'non', label: 'Non, rien de particulier' }], 'sensible');

    const p = { v: this.props.prixVisibilite ?? 8, g: this.props.prixGere ?? 25, m: this.props.prixMateriel ?? 55, s: this.props.prixSecurite ?? 6 };
    const secu = s.sensible === 'oui';
    let reco;
    if (s.support === 'internal' && s.mode === 'achat') {
      reco = { nom: 'Visibilité', sous: 'Votre équipe garde la main, nous fournissons la vue d’ensemble.', unit: p.v, raisons: [
        { t: 'Vous avez déjà quelqu’un pour le support : inutile de payer pour un service que vous n’utiliserez pas.' },
        { t: 'Le portail, les alertes de garantie et l’assistant 24/7 soulagent votre responsable TI.' },
        { t: 'Vous pouvez passer à Géré en tout temps, sans réinstallation.' } ] };
    } else if (s.mode === 'location' || (s.age === 'old' && s.support !== 'internal')) {
      reco = { nom: 'Géré + matériel', sous: 'Le matériel devient un montant mensuel, remplacement inclus.', unit: p.m, raisons: [
        { t: s.mode === 'location' ? 'Vous préférez un montant fixe : le matériel, la garantie et le remplacement aux 4 ans sont inclus.' : 'Votre parc a plus de 4 ans : les bris vont se multiplier, mieux vaut un remplacement planifié qu’un achat d’urgence.' },
        { t: 'Appareil de prêt en 24 h en cas de panne — aucune interruption de travail.' },
        { t: 'Support illimité, sauvegardes, antivirus et plan annuel inclus.' } ] };
    } else {
      reco = { nom: 'Géré', sous: 'Nous nous occupons de tout, vous gardez vos appareils.', unit: p.g, raisons: [
        { t: s.support === 'other' ? 'Vous changez de fournisseur : nous reprenons votre parc tel quel, avec inventaire complet dès la première semaine.' : 'Personne ne s’en occupe à l’interne : support illimité et technicien sur place.' },
        { t: s.age === 'new' ? 'Votre parc est récent : on le maintient en santé plutôt que de le remplacer.' : 'Un plan de remplacement annuel pour étaler les dépenses.' },
        { t: 'Mises à jour, sauvegardes, antivirus et reprise des vieux appareils inclus.' } ] };
    }
    const alerte = total > 50 || total < 5;
    const alerteTexte = total > 50 ? 'Plus de 50 appareils : nous préparons une offre sur mesure avec tarif dégressif.' : 'Moins de 5 appareils : un tarif minimum mensuel peut s’appliquer. Parlons-en.';
    if (secu) reco.raisons = [...reco.raisons, { t: 'Données sensibles : nous ajoutons l’authentification multifacteur, le chiffrement des disques, une sauvegarde hors site et un journal des accès — ce que vos obligations de confidentialité exigent.' }];
    const mensuel = total * (reco.unit + (secu ? p.s : 0));
    return {
      cats, ages, supports, modes, sens, total,
      reco: { ...reco, unitaire: fmt(reco.unit), mensuel: fmt(mensuel), annuel: fmt(mensuel * 12), alerte, alerteTexte, secu, secuUnit: fmt(p.s) }
    };
  }
}

ax(0, 1fr)); gap: 10px\">\n          <sc-for list=\"{{cats}}\" as=\"c\" hint-placeholder-count=\"5\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; border: 1px solid #D5DCE2; padding: 10px 12px 10px 14px\">\n              <span style=\"font-size: 14px; font-weight: 500\">{{c.nom}}</span>\n              <span style=\"display: flex; align-items: center; gap: 4px\">\n                <button onClick=\"{{c.moins}}\" aria-label=\"Moins\" style=\"width: 36px; height: 36px; background: #F5F7F9; border: 1px solid #B8C4CE; font-family: inherit; font-size: 18px; color: #14202B\">−</button>\n                <span style=\"width: 36px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500\">{{c.n}}</span>\n                <button onClick=\"{{c.plus}}\" aria-label=\"Plus\" style=\"width: 36px; height: 36px; background: #F5F7F9; border: 1px solid #B8C4CE; font-family: inherit; font-size: 18px; color: #14202B\">+</button>\n              </span>\n            </div>\n          </sc-for>\n        </div>\n      </section>\n\n      <section style=\"display: flex; flex-direction: column; gap: 12px\">\n        <h2 style=\"margin: 0; font-size: 17px; font-weight: 600\">2. Quel âge a la majorité de vos appareils ?</h2>\n        <div style=\"display: flex; gap: 8px\">\n          <sc-for list=\"{{ages}}\" as=\"a\" hint-placeholder-count=\"3\">\n            <button onClick=\"{{a.pick}}\" style=\"flex: 1; height: 44px; background: {{a.bg}}; color: {{a.fg}}; border: 1px solid {{a.bd}}; font-family: inherit; font-size: 14px; font-weight: 500\">{{a.label}}</button>\n          </sc-for>\n        </div>\n      </section>\n\n      <section style=\"display: flex; flex-direction: column; gap: 12px\">\n        <h2 style=\"margin: 0; font-size: 17px; font-weight: 600\">3. Qui s'occupe de l'informatique aujourd'hui ?</h2>\n        <div style=\"display: flex; gap: 8px\">\n          <sc-for list=\"{{supports}}\" as=\"s\"

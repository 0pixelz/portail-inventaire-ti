<script>
function lookup(scope, pathStr) {
  pathStr = pathStr.trim();
  if (pathStr === 'true') return true; if (pathStr === 'false') return false;
  return pathStr.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
}
function esc(v) { return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function matchBlock(tpl, tag, from) {
  // retourne [openStart, openEnd, closeStart, closeEnd] du premier <tag ...>...</tag> à partir de `from`, en gérant l'imbrication
  const openRe = new RegExp('<' + tag + '\\b[^>]*>', 'g'); openRe.lastIndex = from;
  const m = openRe.exec(tpl); if (!m) return null;
  let depth = 1, i = m.index + m[0].length;
  const anyRe = new RegExp('<' + tag + '\\b[^>]*>|</' + tag + '>', 'g'); anyRe.lastIndex = i;
  let t;
  while ((t = anyRe.exec(tpl))) { depth += t[0][1] === '/' ? -1 : 1; if (depth === 0) return [m.index, m.index + m[0].length, t.index, t.index + t[0].length, m[0]]; }
  return null;
}
function render(tpl, scope, fnMap) {
  for (const tag of ['sc-for', 'sc-if']) {
    let pos = 0, out = '';
    while (true) {
      const b = matchBlock(tpl, tag, pos); if (!b) { out += tpl.slice(pos); break; }
      out += tpl.slice(pos, b[0]);
      const open = b[4], body = tpl.slice(b[1], b[2]);
      if (tag === 'sc-for') {
        const listPath = open.match(/list="\{\{\s*([\w.$]+)\s*\}\}"/)[1], as = open.match(/as="(\w+)"/)[1];
        const list = lookup(scope, listPath) || [];
        out += list.map((item, i) => render(body, { ...scope, [as]: item, $index: i }, fnMap)).join('');
      } else {
        const cond = open.match(/value="\{\{\s*([\w.$]+)\s*\}\}"/)[1];
        out += lookup(scope, cond) ? render(body, scope, fnMap) : '';
      }
      pos = b[3];
    }
    tpl = out;
  }
  tpl = tpl.replace(/onClick="\{\{\s*([\w.$]+)\s*\}\}"/g, (m, p) => fnMap ? fnMap(p, scope) : '');
  tpl = tpl.replace(/\{\{\s*([\w.$]+)\s*\}\}/g, (m, p) => { const v = lookup(scope, p); return typeof v === 'function' ? '' : esc(v); });
  return tpl;
}
class DCLogic{constructor(p){this.props=p||{};this.state={};}setState(s){this.state=Object.assign({},this.state,s);rerender();}}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { n: { postes: 8, portables: 4, ecrans: 10, reseau: 3, imprimantes: 2 }, age: 'mid', support: 'none', mode: 'achat', sensible: 'non' };
  }
  renderVals() {
    const s = this.state;
    const fmt = (v) => v.toLocaleString('fr-CA', { style: 'currency', currency: 'CAD', maximumFractionDigits: 0 });
    const setN = (k, d) => () => this.setState({ n: { ...s.n, [k]: Math.max(0, s.n[k] + d) } });
    const cats = [
      { k: 'postes', nom: 'Postes de travail' }, { k: 'portables', nom: 'Portables' }, { k: 'ecrans', nom: 'Écrans' },
      { k: 'reseau', nom: 'Équipements réseau' }, { k: 'imprimantes', nom: 'Imprimantes' }
    ].map(c => ({ ...c, n: s.n[c.k], plus: setN(c.k, 1), moins: setN(c.k, -1) }));
    const total = Object.values(s.n).reduce((a, b) => a + b, 0);

    const opt = (list, key) => list.map(o => {
      const on = s[key] === o.v;
      return { ...o, pick: () => this.setState({ [key]: o.v }), bg: on ? '#14202B' : '#FFFFFF', fg: on ? '#FFFFFF' : '#14202B', bd: on ? '#14202B' : '#B8C4CE' };
    });
    const ages = opt([{ v: 'new', label: 'Moins de 2 ans' }, { v: 'mid', label: '2 à 4 ans' }, { v: 'old', label: 'Plus de 4 ans' }], 'age');
    const supports = opt([{ v: 'internal', label: 'Quelqu’un à l’interne' }, { v: 'none', label: 'Personne / on se débrouille' }, { v: 'other', label: 'Un autre fournisseur' }], 'support');
    const modes = opt([{ v: 'achat', label: 'Acheter — je garde mes appareils' }, { v: 'location', label: 'Louer — un montant fixe par mois, remplacement inclus' }], 'mode');
    const sens = opt([{ v: 'oui', label: 'Oui — données de patients, financières ou juridiques' }, { v: 'non', label: 'Non, rien de particulier' }], 'sensible');

    const p = { v: this.props.prixVisibilite ?? 8, g: this.props.prixGere ?? 25, m: this.props.prixMateriel ?? 55, s: this.props.prixSecurite ?? 6 };
    const secu = s.sensible === 'oui';
    let reco;
    if (s.support === 'internal' && s.mode === 'achat') {
      reco = { nom: 'Visibilité', sous: 'Votre équipe garde la main, nous fournissons la vue d’ensemble.', unit: p.v, raisons: [
        { t: 'Vous avez déjà quelqu’un pour le support : inutile de payer pour un service que vous n’utiliserez pas.' },
        { t: 'Le portail, les alertes de garantie et l’assistant 24/7 soulagent votre responsable TI.' },
        { t: 'Vous pouvez passer à Géré en tout temps, sans réinstallation.' } ] };
    } else if (s.mode === 'location' || (s.age === 'old' && s.support !== 'internal')) {
      reco = { nom: 'Géré + matériel', sous: 'Le matériel devient un montant mensuel, remplacement inclus.', unit: p.m, raisons: [
        { t: s.mode === 'location' ? 'Vous préférez un montant fixe : le matériel, la garantie et le remplacement aux 4 ans sont inclus.' : 'Votre parc a plus de 4 ans : les bris vont se multiplier, mieux vaut un remplacement planifié qu’un achat d’urgence.' },
        { t: 'Appareil de prêt en 24 h en cas de panne — aucune interruption de travail.' },
        { t: 'Support illimité, sauvegardes, antivirus et plan annuel inclus.' } ] };
    } else {
      reco = { nom: 'Géré', sous: 'Nous nous occupons de tout, vous gardez vos appareils.', unit: p.g, raisons: [
        { t: s.support === 'other' ? 'Vous changez de fournisseur : nous reprenons votre parc tel quel, avec inventaire complet dès la première semaine.' : 'Personne ne s’en occupe à l’interne : support illimité et technicien sur place.' },
        { t: s.age === 'new' ? 'Votre parc est récent : on le maintient en santé plutôt que de le remplacer.' : 'Un plan de remplacement annuel pour étaler les dépenses.' },
        { t: 'Mises à jour, sauvegardes, antivirus et reprise des vieux appareils inclus.' } ] };
    }
    const alerte = total > 50 || total < 5;
    const alerteTexte = total > 50 ? 'Plus de 50 appareils : nous préparons une offre sur mesure avec tarif dégressif.' : 'Moins de 5 appareils : un tarif minimum mensuel peut s’appliquer. Parlons-en.';
    if (secu) reco.raisons = [...reco.raisons, { t: 'Données sensibles : nous ajoutons l’authentification multifacteur, le chiffrement des disques, une sauvegarde hors site et un journal des accès — ce que vos obligations de confidentialité exigent.' }];
    const mensuel = total * (reco.unit + (secu ? p.s : 0));
    return {
      cats, ages, supports, modes, sens, total,
      reco: { ...reco, unitaire: fmt(reco.unit), mensuel: fmt(mensuel), annuel: fmt(mensuel * 12), alerte, alerteTexte, secu, secuUnit: fmt(p.s) }
    };
  }
}

const TPL="\n\n<div style=\"font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #14202B; background: #FFFFFF; display: flex; flex-direction: column; min-height: 1240px\">\n\n  <header style=\"display: flex; align-items: center; justify-content: space-between; padding: 18px 64px; border-bottom: 1px solid #D5DCE2\">\n    <a href=\"index.html\" style=\"display: flex; align-items: center; gap: 10px; text-decoration: none; color: #14202B\">\n      <div style=\"width: 32px; height: 32px; background: #0F6E8C; display: flex; align-items: center; justify-content: center\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"1\"></rect><path d=\"M8 20h8M12 16v4\"></path></svg></div>\n      <span style=\"font-weight: 700; font-size: 17px\">[ENTREPRISE]</span>\n    </a>\n    <a href=\"connexion.html\" style=\"font-size: 14px; font-weight: 600; text-decoration: none\">Portail client</a>\n  </header>\n\n  <div style=\"padding: 56px 64px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 48px; align-items: start\">\n\n    <div style=\"display: flex; flex-direction: column; gap: 28px\">\n      <div style=\"display: flex; flex-direction: column; gap: 8px\">\n        <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #0F6E8C\">ÉVALUATEUR · 2 MINUTES</span>\n        <h1 style=\"margin: 0; font-size: 34px; font-weight: 600; line-height: 1.15\">Quel forfait convient à votre parc ?</h1>\n        <p style=\"margin: 0; font-size: 15.5px; color: #5B6B78; line-height: 1.5\">Répondez à 4 questions. L'estimation est indicative — la visite d'inventaire gratuite la confirme.</p>\n      </div>\n\n      <section style=\"display: flex; flex-direction: column; gap: 14px\">\n        <h2 style=\"margin: 0; font-size: 17px; font-weight: 600\">1. Combien d'appareils avez-vous ?</h2>\n        <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n          <sc-for list=\"{{cats}}\" as=\"c\" hint-placeholder-count=\"5\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; border: 1px solid #D5DCE2; padding: 10px 12px 10px 14px\">\n              <span style=\"font-size: 14px; font-weight: 500\">{{c.nom}}</span>\n              <span style=\"display: flex; align-items: center; gap: 4px\">\n                <button onClick=\"{{c.moins}}\" aria-label=\"Moins\" style=\"width: 36px; height: 36px; background: #F5F7F9; border: 1px solid #B8C4CE; font-family: inherit; font-size: 18px; color: #14202B\">−</button>\n                <span style=\"width: 36px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500\">{{c.n}}</span>\n                <button onClick=\"{{c.plus}}\" aria-label=\"Plus\" style=\"width: 36px; height: 36px; background: #F5F7F9; border: 1px solid #B8C4CE; font-family: inherit; font-size: 18px; color: #14202B\">+</button>\n              </span>\n            </div>\n          </sc-for>\n        </div>\n      </section>\n\n      <section style=\"display: flex; flex-direction: column; gap: 12px\">\n        <h2 style=\"margin: 0; font-size: 17px; font-weight: 600\">2. Quel âge a la majorité de vos appareils ?</h2>\n        <div style=\"display: flex; gap: 8px\">\n          <sc-for list=\"{{ages}}\" as=\"a\" hint-placeholder-count=\"3\">\n            <button onClick=\"{{a.pick}}\" style=\"flex: 1; height: 44px; background: {{a.bg}}; color: {{a.fg}}; border: 1px solid {{a.bd}}; font-family: inherit; font-size: 14px; font-weight: 500\">{{a.label}}</button>\n          </sc-for>\n        </div>\n      </section>\n\n      <section style=\"display: flex; flex-direction: column; gap: 12px\">\n        <h2 style=\"margin: 0; font-size: 17px; font-weight: 600\">3. Qui s'occupe de l'informatique aujourd'hui ?</h2>\n        <div style=\"display: flex; gap: 8px\">\n          <sc-for list=\"{{supports}}\" as=\"s\" hint-placeholder-count=\"3\">\n            <button onClick=\"{{s.pick}}\" style=\"flex: 1; min-height: 44px; padding: 8px 10px; background: {{s.bg}}; color: {{s.fg}}; border: 1px solid {{s.bd}}; font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1.3\">{{s.label}}</button>\n          </sc-for>\n        </div>\n      </section>\n\n      <section style=\"display: flex; flex-direction: column; gap: 12px\">\n        <h2 style=\"margin: 0; font-size: 17px; font-weight: 600\">4. Préférez-vous acheter le matériel ou le louer ?</h2>\n        <div style=\"display: flex; gap: 8px\">\n          <sc-for list=\"{{modes}}\" as=\"m\" hint-placeholder-count=\"2\">\n            <button onClick=\"{{m.pick}}\" style=\"flex: 1; min-height: 44px; padding: 8px 10px; background: {{m.bg}}; color: {{m.fg}}; border: 1px solid {{m.bd}}; font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1.3\">{{m.label}}</button>\n          </sc-for>\n        </div>\n      </section>\n\n      <section style=\"display: flex; flex-direction: column; gap: 12px\">\n        <h2 style=\"margin: 0; font-size: 17px; font-weight: 600\">5. Traitez-vous des données sensibles ?</h2>\n        <p style=\"margin: 0; font-size: 13.5px; color: #5B6B78\">Dossiers de patients, données financières ou juridiques, renseignements sur des enfants.</p>\n        <div style=\"display: flex; gap: 8px\">\n          <sc-for list=\"{{sens}}\" as=\"d\" hint-placeholder-count=\"2\">\n            <button onClick=\"{{d.pick}}\" style=\"flex: 1; min-height: 44px; padding: 8px 10px; background: {{d.bg}}; color: {{d.fg}}; border: 1px solid {{d.bd}}; font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1.3\">{{d.label}}</button>\n          </sc-for>\n        </div>\n      </section>\n    </div>\n\n    <aside style=\"position: sticky; top: 24px; background: #14202B; color: #FFFFFF; padding: 28px; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px\">\n        <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #7FC3D8\">NOTRE RECOMMANDATION</span>\n        <div style=\"font-size: 30px; font-weight: 600\">{{reco.nom}}</div>\n        <div style=\"font-size: 14px; color: #B8C4CE\">{{reco.sous}}</div>\n      </div>\n\n      <div style=\"background: #1F2E3B; padding: 16px; display: flex; flex-direction: column; gap: 6px\">\n        <div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-size: 36px; font-weight: 600\">{{reco.mensuel}}</span><span style=\"font-size: 14px; color: #B8C4CE\">/ mois, avant taxes</span></div>\n        <div style=\"font-size: 13px; color: #B8C4CE\">{{total}} appareils × {{reco.unitaire}} / appareil</div>\n        <sc-if value=\"{{reco.secu}}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size: 13px; color: #7FC3D8\">+ option Sécurité renforcée : {{reco.secuUnit}} / appareil (MFA, chiffrement, sauvegarde hors site, journal d'accès)</div>\n        </sc-if>\n        <div style=\"font-size: 13px; color: #B8C4CE\">Soit environ {{reco.annuel}} par année</div>\n      </div>\n\n      <div style=\"display: flex; flex-direction: column; gap: 10px\">\n        <span style=\"font-size: 13px; font-weight: 600; color: #FFFFFF\">Pourquoi ce forfait</span>\n        <sc-for list=\"{{reco.raisons}}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; gap: 10px; font-size: 13.5px; line-height: 1.45; color: #D5DCE2\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3FBF7F\" stroke-width=\"2.5\" style=\"flex: 0 0 16px; margin-top: 2px\"><path d=\"M5 12l5 5L20 7\"></path></svg><span>{{r.t}}</span></div>\n        </sc-for>\n      </div>\n\n      <sc-if value=\"{{reco.alerte}}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background: #3A2A14; border-left: 3px solid #E0893A; padding: 10px 12px; font-size: 13px; line-height: 1.45; color: #F5D9B8\">{{reco.alerteTexte}}</div>\n      </sc-if>\n\n      <div style=\"display: flex; flex-direction: column; gap: 8px\">\n        <a href=\"index.html\" style=\"display: inline-flex; align-items: center; justify-content: center; height: 48px; background: #0F6E8C; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none\">Confirmer avec une visite gratuite</a>\n        <a href=\"index.html\" style=\"display: inline-flex; align-items: center; justify-content: center; height: 44px; color: #FFFFFF; font-size: 14px; text-decoration: none; border: 1px solid #5B6B78\">Comparer les 3 forfaits</a>\n      </div>\n      <span style=\"font-size: 12px; color: #7F8F9C; line-height: 1.4\">Estimation basée sur vos réponses. Aucun engagement; le prix final est confirmé après l'inventaire.</span>\n    </aside>\n  </div>\n</div>\n";
const inst=new Component({"prixVisibilite":8,"prixGere":25,"prixMateriel":55,"prixSecurite":6});
let FN=[];
function rerender(){FN=[];const vals=inst.renderVals();
const html=render(TPL,vals,(p,scope)=>{const f=lookup(scope,p);FN.push(f);return 'data-fn="'+(FN.length-1)+'"';});
document.getElementById('app').innerHTML=html;
document.querySelectorAll('[data-fn]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();FN[+el.dataset.fn]();}));}
rerender();
</script><script>
(function(){if(window.innerWidth<820){var um=document.querySelector('[data-usermenu]'),row=document.querySelector('body > div > nav > div:first-child');if(um&&row){row.appendChild(um);um.style.marginLeft='auto';}}document.querySelectorAll('[data-usermenu]').forEach(function(w){var b=w.querySelector('button'),m=w.querySelector('[role=menu]');b.addEventListener('click',function(e){e.stopPropagation();m.style.display=m.style.display==='flex'?'none':'flex';});document.addEventListener('click',function(){m.style.display='none';});});})();
</script>
